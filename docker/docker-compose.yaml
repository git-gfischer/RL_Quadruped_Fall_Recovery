services:
  isaaclab:
    image: isaaclab_dls:latest
    container_name: isaaclab
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../basic-locomotion-dls-isaaclab:/workspace/basic-locomotion-dls-isaaclab
    stdin_open: true   # like -i
    tty: true          # like -t
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
